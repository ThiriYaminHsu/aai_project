[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circopt-adder"
version = "0.1.0"
description = "RL agents for ZX-calculus circuit optimisation (GATv2 actor-critic PPO), ablating random-vs-adder-structured training data"
requires-python = ">=3.10"
dependencies = [
    "pyzx>=0.10.5",
    "torch>=2.0",
    "torch-geometric>=2.5",
    "numpy",
    "gymnasium",
    "matplotlib",
    "seaborn",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
# Only for scripts/visualize_graph_transform.py's gate-box circuit diagrams -- pyzx
# has no circuit-diagram renderer of its own (it's a ZX-calculus library), and
# qiskit's is not otherwise needed by training/evaluation/analysis.
viz = ["qiskit", "pylatexenc"]

[tool.setuptools.packages.find]
where = ["src"]
